[package]
name = "many-eyes-viz"
version = "0.1.0"
edition = "2021"
description = "Web visualization for Many-Eyes Learning"
authors = ["Many-Eyes Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo = { version = "0.11", features = ["futures", "timers", "net"] }
gloo-net = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
] }
js-sys = "0.3"
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"
futures = "0.3"

[profile.release]
lto = true
opt-level = "z"
