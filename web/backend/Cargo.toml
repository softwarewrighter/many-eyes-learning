[package]
name = "many-eyes-server"
version = "0.1.0"
edition = "2021"
description = "Backend server for Many-Eyes Learning visualization"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
